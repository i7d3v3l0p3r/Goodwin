name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            station_runtimes: false
            timeout: 35
          - runner: ubuntu-24.04
            station_runtimes: true
            timeout: 65
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
      - name: Build the embedded panel
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path installer/Cargo.toml --all --check
          cargo fmt --manifest-path plugins/vpn/engines/Cargo.toml --all --check
      - name: Check wake corpus isolation
        run: python -m unittest discover -s scripts -p test_wakeword_manifest.py
      - name: Test the default workspace
        run: cargo test --locked --workspace
      - name: Lint the default workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check the Linux VLESS workers
        if: matrix.station_runtimes
        run: |
          cargo test --locked --manifest-path plugins/vpn/engines/Cargo.toml --target-dir target
          cargo clippy --locked --manifest-path plugins/vpn/engines/Cargo.toml --target-dir target --all-targets -- -D warnings
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path installer/Cargo.toml
      - name: Test the Windows headless installer
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path installer/Cargo.toml --no-default-features
      - name: Build native and WASM fixtures
        if: matrix.station_runtimes
        shell: bash
        run: |
          zig=zig-x86_64-linux-0.17.1
          archive="$RUNNER_TEMP/$zig.tar.xz"
          curl -fsSL --retry 3 "https://ziglang.org/download/0.17.1/$zig.tar.xz" -o "$archive"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$zig:$PATH"
          rustup target add wasm32-unknown-unknown
          python scripts/build-wake-tflite.py
          python scripts/build-wasm-plugins.py
      - name: Test with Station runtimes
        if: matrix.station_runtimes
        run: cargo test --locked --workspace --features goodwin/wake-tflite,goodwin/wasm-plugins
      - name: Check published wake model reference scores
        if: matrix.station_runtimes
        shell: bash
        run: |
          python scripts/prepare-wake-reference.py
          GOODWIN_WAKE_REFERENCE_DIR="$PWD/target/wake-reference" \
            cargo test --locked --workspace --features goodwin/wake-tflite,goodwin/wasm-plugins \
            -- --ignored --exact wake::tests::published_models_match_the_synthetic_reference
      - name: Lint with Station runtimes
        if: matrix.station_runtimes
        run: cargo clippy --locked --workspace --all-targets --features goodwin/wake-tflite,goodwin/wasm-plugins -- -D warnings
      - name: Check the INT8-only Station profile
        if: matrix.station_runtimes
        shell: bash
        run: |
          cargo test --locked -p goodwin --no-default-features --features wake-tflite,wasm-plugins
          GOODWIN_WAKE_REFERENCE_DIR="$PWD/target/wake-reference" \
            cargo test --locked -p goodwin --no-default-features --features wake-tflite,wasm-plugins \
            -- --ignored --exact wake::tests::published_models_match_the_synthetic_reference
          cargo clippy --locked -p goodwin --all-targets --no-default-features --features wake-tflite,wasm-plugins -- -D warnings
      - name: Check the native runtime boundaries with ASan and UBSan
        if: matrix.station_runtimes
        shell: bash
        run: bash scripts/test-native-boundaries.sh
      - name: Test the Linux headless installer and upgrade script
        if: matrix.station_runtimes
        shell: bash
        run: |
          cargo test --locked --manifest-path installer/Cargo.toml --no-default-features
          sh installer/tests/station-install.sh
      - name: Install the ESP32-S3 toolchains
        if: matrix.station_runtimes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          installer="$RUNNER_TEMP/espup"
          curl -fsSL --retry 3 https://github.com/esp-rs/espup/releases/download/v0.19.0/espup-x86_64-unknown-linux-gnu -o "$installer"
          echo "f31411c64dffff4da0f0e23c432b9a5fda48942ff8695b8b21009ceb7007bcc0  $installer" | sha256sum -c
          chmod +x "$installer"
          "$installer" install --std --targets esp32s3 --toolchain-version 1.97.0.0 --export-file "$RUNNER_TEMP/export-esp.sh"
          cargo install ldproxy --locked
          git clone --depth 1 --branch v5.5.2 --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s3
      - name: Build ESP32-S3 firmware and package the WASM guests
        if: matrix.station_runtimes
        shell: bash
        run: |
          source "$RUNNER_TEMP/export-esp.sh"
          source "$RUNNER_TEMP/esp-idf/export.sh"
          export ESP_IDF_TOOLS_INSTALL_DIR=fromenv
          python scripts/build-esp32s3.py --emulator
          python scripts/package-plugin.py plugins/timers target/wasm32-unknown-unknown/release/goodwin-timers.wasm \
            wasm32 target/plugins/timers-wasm32.tar.gz --wasm-state-file timers.json
          python scripts/package-plugin.py plugins/wake-dataset target/wasm32-unknown-unknown/release/goodwin-wake-dataset.wasm \
            wasm32 target/plugins/wake-dataset-wasm32.tar.gz
      - name: Test ESP32-S3 firmware in ESP-EMU
        if: matrix.station_runtimes
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          release=https://github.com/espressif/esp-emulator/releases/download/v1.2.0
          emulator=esp-emu-1.2.0-x86_64-unknown-linux-gnu
          examples=esp-emu-1.2.0-examples
          for archive in "$emulator" "$examples"; do
            curl -fsSL --retry 3 "$release/$archive.tar.gz" -o "$RUNNER_TEMP/$archive.tar.gz"
          done
          cat > "$RUNNER_TEMP/esp-emu-SHA256SUMS" <<EOF
          560236344fd69dc8d74bc862c79aea01f7a69ac626ae3f54b1b0946bbce078c1  $emulator.tar.gz
          2951a0f7596a2e622cd9c1f034d68fc21549da2614467bde0f4e52115d75fbcb  $examples.tar.gz
          EOF
          (
            cd "$RUNNER_TEMP"
            sha256sum -c esp-emu-SHA256SUMS
            tar -xzf "$emulator.tar.gz"
            tar -xzf "$examples.tar.gz"
          )
          python firmware/esp32s3/test_emulator.py \
            --emulator "$RUNNER_TEMP/$emulator/esp-emu" --examples "$RUNNER_TEMP/$examples" \
            --firmware target/esp32s3/emulator/merged.bin --emulator-timeout 720 \
            --wake-build --panel-settings --stream-speech --wifi-during-alarm \
            --alarm-during-stream \
            --wake-catalog-model target/wake-tflite/esp32s3/goodwin-micro-int8.tflite \
            --timers-package target/plugins/timers-wasm32.tar.gz \
            --dataset-package target/plugins/wake-dataset-wasm32.tar.gz
