name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            station_runtimes: false
          - runner: ubuntu-24.04
            station_runtimes: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
      - name: Build the embedded panel
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path installer/Cargo.toml --all --check
      - name: Test the default workspace
        run: cargo test --locked --workspace
      - name: Lint the default workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build native and WASM fixtures
        if: matrix.station_runtimes
        shell: bash
        run: |
          zig=zig-x86_64-linux-0.17.1
          archive="$RUNNER_TEMP/$zig.tar.xz"
          curl -fsSL --retry 3 "https://ziglang.org/download/0.17.1/$zig.tar.xz" -o "$archive"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$zig:$PATH"
          rustup target add wasm32-unknown-unknown
          python scripts/build-wake-tflite.py
          python scripts/build-wasm-plugins.py
      - name: Test with Station runtimes
        if: matrix.station_runtimes
        run: cargo test --locked --workspace --features goodwin/wake-tflite,goodwin/wasm-plugins
      - name: Lint with Station runtimes
        if: matrix.station_runtimes
        run: cargo clippy --locked --workspace --all-targets --features goodwin/wake-tflite,goodwin/wasm-plugins -- -D warnings
      - name: Check the native runtime boundaries with ASan and UBSan
        if: matrix.station_runtimes
        shell: bash
        run: bash scripts/test-native-boundaries.sh
      - name: Test the Linux headless installer and upgrade script
        if: matrix.station_runtimes
        shell: bash
        run: |
          cargo test --locked --manifest-path installer/Cargo.toml --no-default-features
          sh installer/tests/station-install.sh
