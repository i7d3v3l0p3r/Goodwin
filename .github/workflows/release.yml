name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust and Zig
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-unknown-linux-musl
          rustup override set 1.100.0

          zig=zig-x86_64-linux-0.17.1
          archive="$RUNNER_TEMP/$zig.tar.xz"
          curl -fsSL --retry 3 "https://ziglang.org/download/0.17.1/$zig.tar.xz" -o "$archive"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked

      - name: Prepare release notes
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "goodwin") | .version')
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the Goodwin version v$version." >&2
            exit 1
          fi

          mkdir -p target/release-assets
          awk -v heading="## [$version] - " '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found && (printed || NF) { print; printed = 1 }
            END { if (!printed) exit 1 }
          ' CHANGELOG.md > target/release-assets/release-notes.md || {
            echo "No release notes for $version in CHANGELOG.md." >&2
            exit 1
          }

      - name: Build, test and package
        run: |
          npm ci --prefix web
          npm run build --prefix web
          cargo test --locked --workspace
          target=aarch64-unknown-linux-musl
          cargo zigbuild --locked --workspace --release --target "$target"

          python scripts/package-station.py --standard models/standard.onnx --micro models/micro.onnx \
            --encoders models --output target/release-assets/goodwin-mini3-aarch64.tar.gz
          for plugin in probe timers; do
            python scripts/package-plugin.py "plugins/$plugin" "target/$target/release/goodwin-$plugin" \
              linux-aarch64 "target/release-assets/$plugin-linux-aarch64.tar.gz"
          done

          (cd target/release-assets && sha256sum -- *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(goodwin-mini3-aarch64.tar.gz probe-linux-aarch64.tar.gz timers-linux-aarch64.tar.gz SHA256SUMS)
          sha256sum -c SHA256SUMS

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$tag" --json url --jq .url
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Goodwin $tag" --notes-file release-notes.md
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --title "Goodwin $tag" --notes-file release-notes.md
