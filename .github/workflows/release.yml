name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust and Zig
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-unknown-linux-musl
          rustup override set 1.100.0

          zig=zig-x86_64-linux-0.17.1
          archive="$RUNNER_TEMP/$zig.tar.xz"
          curl -fsSL --retry 3 "https://ziglang.org/download/0.17.1/$zig.tar.xz" -o "$archive"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked

      - name: Prepare release notes
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "goodwin") | .version')
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the Goodwin version v$version." >&2
            exit 1
          fi

          mkdir -p target/release-assets
          awk -v heading="## [$version] - " '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found && (printed || NF) { print; printed = 1 }
            END { if (!printed) exit 1 }
          ' CHANGELOG.md > target/release-assets/release-notes.md || {
            echo "No release notes for $version in CHANGELOG.md." >&2
            exit 1
          }

      - name: Build, test and package
        run: |
          npm ci --prefix web
          npm run build --prefix web
          python scripts/build-wake-tflite.py
          rustup target add wasm32-unknown-unknown
          python scripts/build-wasm-plugins.py
          cargo test --locked --workspace --features goodwin/wake-tflite,goodwin/wasm-plugins
          python scripts/build-wake-tflite.py --target aarch64-musl
          target=aarch64-unknown-linux-musl
          linker="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          # Keep Rust's Cortex-A53 erratum workaround when linking the Station binaries.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-C linker=$linker -C linker-flavor=ld.lld" \
            cargo zigbuild --locked --workspace --features goodwin/wake-tflite,goodwin/wasm-plugins --release --target "$target"

          python scripts/package-station.py --output target/release-assets/goodwin-mini3-aarch64.tar.gz
          python scripts/package-plugin.py plugins/timers "target/$target/release/goodwin-timers" \
            linux-aarch64 target/release-assets/timers-linux-aarch64.tar.gz
          python scripts/package-plugin.py plugins/timers target/wasm32-unknown-unknown/release/goodwin-timers.wasm \
            wasm32 target/release-assets/timers-wasm32.tar.gz --wasm-state-file timers.json
          python scripts/package-plugin.py plugins/openai-compatible "target/$target/release/goodwin-openai-compatible" \
            linux-aarch64 target/release-assets/openai-compatible-linux-aarch64.tar.gz
          python scripts/package-plugin.py plugins/wake-dataset "target/$target/release/goodwin-wake-dataset" \
            linux-aarch64 target/release-assets/wake-dataset-linux-aarch64.tar.gz
          for plugin in openai-compatible wake-dataset; do
            python scripts/package-plugin.py "plugins/$plugin" "target/wasm32-unknown-unknown/release/goodwin-$plugin.wasm" \
              wasm32 "target/release-assets/$plugin-wasm32.tar.gz"
          done

          (cd target/release-assets && sha256sum -- *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
          overwrite: true

  installer:
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libwayland-dev libxkbcommon-dev
      - name: Build and test the installer
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 test --locked --release --manifest-path installer/Cargo.toml
          cargo +1.100.0 build --locked --release --manifest-path installer/Cargo.toml
      - name: Test the Station deployment script
        if: runner.os == 'Linux'
        run: sh installer/tests/station-install.sh
      - name: Package the installer
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="goodwin-installer-$PLATFORM"
          binary=installer/target/release/goodwin-installer
          mkdir -p target/installer-assets
          case "$RUNNER_OS" in
            Windows) cp "$binary.exe" "target/installer-assets/$name.exe" ;;
            Linux) tar -czf "target/installer-assets/$name.tar.gz" -C installer/target/release goodwin-installer ;;
            macOS)
              app="target/installer-package/Goodwin Installer.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$binary" "$app/Contents/MacOS/"
              cp installer/Info.plist "$app/Contents/"
              cp installer/icons/goodwin.icns "$app/Contents/Resources/"
              codesign --force --sign - "$app"
              tar -czf "target/installer-assets/$name.tar.gz" -C target/installer-package "Goodwin Installer.app"
              ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}
          path: target/installer-assets/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [build, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-assets
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          installers=(goodwin-installer-windows-x64.exe goodwin-installer-linux-x64.tar.gz
            goodwin-installer-macos-arm64.tar.gz goodwin-installer-macos-x64.tar.gz)
          assets=(goodwin-mini3-aarch64.tar.gz timers-linux-aarch64.tar.gz timers-wasm32.tar.gz openai-compatible-linux-aarch64.tar.gz
            wake-dataset-linux-aarch64.tar.gz openai-compatible-wasm32.tar.gz wake-dataset-wasm32.tar.gz
            "${installers[@]}" SHA256SUMS)
          sha256sum -- "${installers[@]}" >> SHA256SUMS
          sha256sum -c SHA256SUMS

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$tag" --json url --jq .url
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Goodwin $tag" --notes-file release-notes.md
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --title "Goodwin $tag" --notes-file release-notes.md
