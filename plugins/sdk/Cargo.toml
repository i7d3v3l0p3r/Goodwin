[package]
name = "goodwin-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["plugin-api"]
plugin-api = ["dep:goodwin-error"]
wasm-guest = ["plugin-api", "serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
goodwin-json = { path = "../../shared/json" }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
serde_json = { version = "1", default-features = false, features = ["raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
goodwin-error = { path = "../../shared/error", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
goodwin-error = { path = "../../shared/error" }
serde = { version = "1", features = ["std"] }
serde_json = { version = "1", features = ["std"] }
tempfile = "3"
