[package]
name = "goodwin-vpn"
default-run = "goodwin-vpn"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
goodwin-error = { path = "../../shared/error" }
serde = { version = "1", features = ["derive"] }
http = "1"

[target.'cfg(target_os = "linux")'.dependencies]
goodwin-plugin = { path = "../sdk" }
libc = "0.2"
serde_json = "1"
url = "2"
base64 = "0.23"
tempfile = "3"
sha2 = "0.11"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
base64 = "0.23"
serde_json = "1"
url = "2"
