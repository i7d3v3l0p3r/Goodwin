[package]
name = "goodwin-openrouter"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
goodwin-openai-compatible = { path = "../openai-compatible" }
goodwin-plugin = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
goodwin-plugin = { path = "../sdk", features = ["wasm-guest"] }
