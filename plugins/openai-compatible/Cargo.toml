[package]
name = "goodwin-openai-compatible"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
goodwin-error = { path = "../../shared/error" }
base64 = "0.23"
goodwin-plugin = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "socks", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
goodwin-plugin = { path = "../sdk", features = ["wasm-guest"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
