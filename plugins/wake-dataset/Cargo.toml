[package]
name = "goodwin-wake-dataset"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
goodwin-plugin = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
goodwin-plugin = { path = "../sdk", features = ["wasm-guest"] }
