[package]
name = "goodwin-spotify"
version = "0.2.3"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23"
goodwin-error = { path = "../../shared/error" }
goodwin-plugin = { path = "../sdk" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["query", "socks", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros"] }
