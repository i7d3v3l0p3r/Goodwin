[package]
name = "goodwin"
version = "0.3.1"
edition = "2024"
description = "An alternative voice assistant for Yandex Station"
license = "MIT"

[workspace]
members = ["plugins/openai-compatible", "plugins/openrouter", "plugins/sdk", "plugins/timers", "plugins/wake-dataset"]
default-members = ["."]
resolver = "3"

[features]
hotpath-alloc = ["dep:hotpath", "hotpath/hotpath-alloc"]
wake-tflite = []
wasm-plugins = ["dep:wasmi", "reqwest/multipart"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
goodwin-plugin = { path = "plugins/sdk" }
hotpath = { version = "0.33", optional = true }
livekit-wakeword = "0.2"
log = { version = "0.4", features = ["std"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rpassword = "7"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
tract-onnx = "0.22"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
wasmi = { version = "=2.0.2", optional = true, default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
