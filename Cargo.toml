[package]
name = "goodwin"
version = "0.1.0"
edition = "2024"
description = "An alternative voice assistant for Yandex Station"
license = "MIT"

[workspace]
members = ["plugins/sdk", "plugins/timers"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
blake2 = "0.10"
flate2 = "1"
getrandom = "0.3"
livekit-wakeword = "0.2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["alternative-backend"] }
ort-tract = "0.2"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
