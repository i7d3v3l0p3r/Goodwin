[package]
name = "goodwin"
version = "0.5.0"
edition = "2024"
description = "An alternative voice assistant for Yandex Station"
license = "MIT"

[workspace]
members = ["plugins/openai-compatible", "plugins/sdk", "plugins/timers", "plugins/wake-dataset", "shared/error", "shared/json"]
default-members = ["."]
resolver = "3"

[profile.esp-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.esp-release.package.miniz_oxide]
opt-level = 3

[features]
default = ["wake-onnx"]
esp-emulator = []
model-mini3 = []
model-esp32s3-generic = []
hotpath-alloc = ["dep:hotpath", "hotpath/hotpath-alloc"]
wake-bench = []
wake-onnx = ["dep:livekit-wakeword", "dep:rustfft", "dep:tract-onnx"]
wake-tflite = ["dep:sha2", "dep:url"]
wasm-plugins = ["dep:wasmparser", "dep:flate2", "dep:url", "reqwest/multipart", "reqwest/query"]

[dependencies]
goodwin-error = { path = "shared/error" }
base64 = "0.23"
getrandom = "0.4"
goodwin-plugin = { path = "plugins/sdk" }
goodwin-json = { path = "shared/json", features = ["std"] }
log = { version = "0.4", features = ["std"] }
phc = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(any(target_os = "linux", target_os = "espidf"))'.dependencies]
wasmparser = { version = "0.263", default-features = false, features = ["std"], optional = true }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
axum = "0.8"
blake2 = "0.11"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
hotpath = { version = "0.33", optional = true }
livekit-wakeword = { version = "0.2", optional = true }
mime = "0.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
ring = { version = "0.17", default-features = false }
rpassword = "7"
rustfft = { version = "6.4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time"] }
tract-onnx = { version = "0.22", optional = true }
url = "2"
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.54"
flate2 = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
url = { version = "2", optional = true }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[target.'cfg(not(target_os = "espidf"))'.dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.2"
esp_idf_sdkconfig_defaults = ["firmware/esp32s3/sdkconfig.defaults"]
