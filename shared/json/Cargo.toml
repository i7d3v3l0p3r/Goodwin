[package]
name = "goodwin-json"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
std = []

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"] }
serde-json-core = { version = "0.7", default-features = false }

[dev-dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
