[package]
name = "goodwin-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:mdns-sd", "dep:rfd", "dep:webbrowser", "dep:windows-sys"]

[dependencies]
anyhow = "1"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
flate2 = "1"
mdns-sd = { version = "0.22", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
webbrowser = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

[build-dependencies]
winresource = "0.1"
