[package]
name = "goodwin-installer"
version = "0.3.1"
edition = "2024"
license = "MIT"

[workspace]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:mdns-sd", "dep:rfd", "dep:webbrowser", "dep:windows-sys"]

[dependencies]
goodwin-error = { path = "../shared/error" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"], optional = true }
flate2 = "1"
goodwin-json = { path = "../shared/json", features = ["std"] }
mdns-sd = { version = "0.22", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rfd = { version = "0.18", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
webbrowser = { version = "1", optional = true }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json = "1"
