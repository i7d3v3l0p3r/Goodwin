[package]
name = "goodwin-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1"
mdns-sd = { version = "0.22", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.18"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
webbrowser = "1"

[build-dependencies]
winresource = "0.1"
